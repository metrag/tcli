[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcli"
version = "0.1.0"
description = "CLI для Tinkoff Invest API (только песочница)"
readme = "README.md"
requires-python = ">=3.10"
# tinkoff-investments ставится отдельно с --no-deps (см. README, шаг 2):
# прямая ссылка на git в dependencies заставила бы pip резолвить его зависимости повторно.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
tcli = "tcli.cli:app"

[tool.setuptools]
packages = ["tcli", "skills"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
